<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --gold-dim: rgba(201, 168, 76, 0.15);
            --bg-deep: #080b12;
            --bg-card: rgba(12, 16, 26, 0.95);
            --text-primary: #f0ead6;
            --text-muted: #8a8070;
            --border: rgba(201, 168, 76, 0.25);
            --error: #e05a5a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-deep);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* ── Particle Canvas ── */
        #canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Radial glow in background ── */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            top: -100px; left: -100px;
            animation: driftA 12s ease-in-out infinite alternate;
        }
        .bg-glow-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(100,140,255,0.06) 0%, transparent 70%);
            bottom: -80px; right: -80px;
            animation: driftB 15s ease-in-out infinite alternate;
        }
        @keyframes driftA { to { transform: translate(60px, 80px); } }
        @keyframes driftB { to { transform: translate(-50px, -60px); } }

        /* ── Grid overlay ── */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                    linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Card wrapper ── */
        .card-wrapper {
            position: relative;
            z-index: 10;
            animation: cardReveal 1s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes cardReveal {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }

        /* ── Glowing border ring ── */
        .card-ring {
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: conic-gradient(
                    from 0deg,
                    transparent 0%,
                    var(--gold) 25%,
                    transparent 50%,
                    rgba(201,168,76,0.3) 75%,
                    transparent 100%
            );
            animation: ringRotate 6s linear infinite;
            z-index: -1;
        }
        @keyframes ringRotate { to { transform: rotate(360deg); } }

        .card-ring-inner {
            position: absolute;
            inset: 2px;
            border-radius: 20px;
            background: var(--bg-deep);
        }

        /* ── Main card ── */
        .card {
            width: 440px;
            padding: 52px 48px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        /* subtle top shimmer line */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* ── Logo / Icon area ── */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            animation: fadeDown 0.9s 0.2s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--gold-dim), rgba(201,168,76,0.05));
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }
        .logo-icon svg {
            width: 28px; height: 28px;
            stroke: var(--gold);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 24px;
            border: 1px solid rgba(201,168,76,0.12);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-align: center;
        }

        /* ── Error message ── */
        .error-banner {
            background: rgba(224, 90, 90, 0.1);
            border: 1px solid rgba(224, 90, 90, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shakeIn 0.5s cubic-bezier(0.36,0.07,0.19,0.97);
        }
        @keyframes shakeIn {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .error-banner svg {
            width: 16px; height: 16px;
            stroke: var(--error); flex-shrink: 0;
            fill: none; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .error-banner span {
            font-size: 13px;
            color: var(--error);
            letter-spacing: 0.2px;
        }

        /* ── Form ── */
        form {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .field {
            margin-bottom: 22px;
            animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
        }
        .field:nth-child(1) { animation-delay: 0.35s; }
        .field:nth-child(2) { animation-delay: 0.45s; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .field:focus-within label {
            color: var(--gold-light);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
            pointer-events: none;
        }
        .field:focus-within .input-icon {
            stroke: var(--gold);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 44px 14px 44px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition:
                    border-color 0.3s,
                    background 0.3s,
                    box-shadow 0.3s;
            letter-spacing: 0.3px;
        }
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(138,128,112,0.5);
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--gold);
            background: rgba(201,168,76,0.04);
            box-shadow: 0 0 0 4px rgba(201,168,76,0.08), inset 0 1px 0 rgba(201,168,76,0.05);
        }

        /* password toggle */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            color: var(--text-muted);
            transition: color 0.2s;
            display: flex; align-items: center;
        }
        .eye-btn:hover { color: var(--gold); }
        .eye-btn svg {
            width: 16px; height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Submit button ── */
        .submit-wrap {
            margin-top: 8px;
            animation: fadeUp 0.8s 0.55s cubic-bezier(0.16,1,0.3,1) both;
        }

        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--gold) 0%, #a8873a 100%);
            border: none;
            border-radius: 12px;
            color: #0a0700;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        input[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        input[type="submit"]:hover::before {
            left: 100%;
        }
        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201,168,76,0.35);
        }
        input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(201,168,76,0.2);
        }

        /* ── Footer text ── */
        .card-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            animation: fadeUp 0.8s 0.65s cubic-bezier(0.16,1,0.3,1) both;
        }
        .card-footer a {
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .card-footer a:hover { border-color: var(--gold); }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="grid-overlay"></div>

<div class="card-wrapper">
    <div class="card-ring"></div>
    <div class="card-ring-inner"></div>

    <div class="card">

        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1>Welcome Back</h1>
            <a th:href="@{/}" class="subtitle">Sign in to continue</a>

        </div>

        <!-- Thymeleaf error block -->
        <div class="error-banner" th:if="${param.error}" style="display:none"
             th:style="'display:flex'">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>Invalid username or password. Please try again.</span>
        </div>

        <!-- Demo error for preview (remove when using Thymeleaf) -->
        <!-- <div class="error-banner">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Invalid username or password.</span>
        </div> -->

        <form th:action="@{/authenticateTheUser}" method="post">

            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username"/>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password"/>
                    <button type="button" class="eye-btn" id="togglePwd" aria-label="Show password">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="submit-wrap">
                <input type="submit" value="Sign In"/>
            </div>

        </form>

        <div class="card-footer">
            Forgot your password? <a href="#">Reset here</a>
        </div>

    </div>
</div>

<script>
    /* ── Particle System ── */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], mouse = { x: null, y: null };

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', () => { resize(); initParticles(); });
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x  = Math.random() * W;
            this.y  = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.size  = Math.random() * 1.5 + 0.4;
            this.alpha = Math.random() * 0.4 + 0.05;
            this.gold  = Math.random() > 0.75;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Mouse repulsion
            if (mouse.x !== null) {
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    const force = (100 - dist) / 100;
                    this.x += (dx / dist) * force * 1.5;
                    this.y += (dy / dist) * force * 1.5;
                }
            }

            if (this.x < 0 || this.x > W) this.vx *= -1;
            if (this.y < 0 || this.y > H) this.vy *= -1;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.gold
                ? `rgba(201,168,76,${this.alpha})`
                : `rgba(200,200,220,${this.alpha * 0.5})`;
            ctx.fill();
        }
    }

    function initParticles() {
        const count = Math.floor((W * H) / 8000);
        particles = Array.from({ length: count }, () => new Particle());
    }
    initParticles();

    function drawConnections() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const alpha = (1 - dist / 120) * 0.12;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(201,168,76,${alpha})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => { p.update(); p.draw(); });
        drawConnections();
        requestAnimationFrame(animate);
    }
    animate();

    /* ── Password Toggle ── */
    const toggleBtn = document.getElementById('togglePwd');
    const pwdInput  = document.getElementById('password');
    const eyeIcon   = document.getElementById('eyeIcon');

    const eyeOpen   = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    toggleBtn.addEventListener('click', () => {
        const show = pwdInput.type === 'password';
        pwdInput.type = show ? 'text' : 'password';
        eyeIcon.innerHTML = show ? eyeClosed : eyeOpen;
    });

    /* ── Input field ripple on focus ── */
    document.querySelectorAll('input[type=text], input[type=password]').forEach(inp => {
        inp.addEventListener('focus', function () {
            this.parentElement.classList.add('focused');
        });
        inp.addEventListener('blur', function () {
            this.parentElement.classList.remove('focused');
        });
    });

    /* ── Submit button loading state ── */
    document.querySelector('form').addEventListener('submit', function() {
        const btn = this.querySelector('input[type=submit]');
        btn.value = 'Signing In…';
        btn.style.opacity = '0.8';
        btn.style.pointerEvents = 'none';
    });
</script>

</body>
</html>
